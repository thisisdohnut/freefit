[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "freefit"
version = "0.1.0"
description = "Free Inference Fitness & Intelligence Tracker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rich>=13.7,<15"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
freefit = "freefit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
